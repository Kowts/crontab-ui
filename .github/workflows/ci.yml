name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json

      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-node-${{ matrix.node-version }}
          path: npm-audit.json

      - name: Build container image
        run: docker build --tag crontab-ui:${{ github.sha }} .

      - name: Scan container image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: crontab-ui:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  docker-scheduler:
    name: Docker scheduler integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Publish and execute a scheduled task as node
        run: npm run test:docker-scheduler
