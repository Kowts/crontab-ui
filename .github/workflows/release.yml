name: Release

# Separate from CI: only a version tag publishes, and only after the same gates pass.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run lint
      - run: npm test
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment to gate promotion to production.
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            IMAGE_VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output: sbom.spdx.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release create "${GITHUB_REF_NAME}" sbom.spdx.json \
            --title "${GITHUB_REF_NAME}" \
            --notes "Image: ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}. See CHANGELOG.md and docs/RELEASE_NOTES.md. Roll back by deploying a previous tag or digest."
