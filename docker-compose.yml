services:
  crontab-ui:
    build: .
    image: alseambusher/crontab-ui
    ports:
      - "8000:8000"
    environment:
      BASIC_AUTH_USERS_JSON: ${BASIC_AUTH_USERS_JSON:?Configure authenticated users}
      AUTHZ_ROLE_MAP_JSON: ${AUTHZ_ROLE_MAP_JSON:?Configure user roles}
      CSRF_SECRET: ${CSRF_SECRET:?Configure CSRF secret}
    volumes:
      - crontab-data:/crontab-ui/crontabs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  crontab-data:
