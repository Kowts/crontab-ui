services:
  crontab-ui:
    build: .
    image: kowts/crontab-ui
    expose:
      - "8000"
    networks:
      - crontab-ui-internal
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      BASIC_AUTH_USERS_JSON: ${BASIC_AUTH_USERS_JSON:?Configure authenticated users}
      AUTHZ_ROLE_MAP_JSON: ${AUTHZ_ROLE_MAP_JSON:?Configure user roles}
      CSRF_SECRET: ${CSRF_SECRET:?Configure CSRF secret}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
    volumes:
      - crontab-data:/crontab-ui/crontabs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Supervisor needs only these capabilities to start both managed processes as node.
    cap_add:
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  crontab-data:

networks:
  crontab-ui-internal:
    name: ${CRONTAB_UI_NETWORK:-crontab-ui-internal}
